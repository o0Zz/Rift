<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Source of every app icon: regenerate with `npx tauri icon src-tauri/icons/rift.svg`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="12"/>
  <!-- R: stem, bowl and leg as one round-capped stroke -->
  <path d="M290 790 V250 H520 A150 150 0 0 1 520 550 H290 M480 550 L660 790"
        fill="none" stroke="#ffffff" stroke-width="110" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Terminal cursor -->
  <rect x="730" y="730" width="170" height="70" rx="18" fill="url(#cursor)"/>
</svg>
