<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Source of every app icon: regenerate with `npx tauri icon src-tauri/icons/rift.svg` (see CLAUDE.md). -->
  <!-- A console window: title bar with the three dots, then "R_" as a prompt. -->
  <defs>
    <clipPath id="window">
      <rect x="40" y="72" width="944" height="880" rx="150"/>
    </clipPath>
  </defs>
  <g clip-path="url(#window)">
    <rect x="40" y="72" width="944" height="880" fill="#0d1117"/>
    <rect x="40" y="72" width="944" height="170" fill="#21262d"/>
  </g>
  <rect x="40" y="72" width="944" height="880" rx="150" fill="none" stroke="#3d444d" stroke-width="16"/>
  <circle cx="190" cy="157" r="38" fill="#ff5f57"/>
  <circle cx="310" cy="157" r="38" fill="#febc2e"/>
  <circle cx="430" cy="157" r="38" fill="#28c840"/>
  <!-- R: stem, bowl and leg as one round-capped stroke -->
  <path d="M260 830 V360 H470 A135 135 0 0 1 470 630 H260 M440 630 L610 830"
        fill="none" stroke="#e6edf3" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Terminal cursor -->
  <rect x="690" y="770" width="190" height="72" rx="10" fill="#3fb950"/>
</svg>
