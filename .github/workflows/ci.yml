name: CI

# Every push and PR: checks and tests on Windows, Linux and macOS.
# Pushes to master also build the installers of each OS, downloadable from the run page (Artifacts).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
            # One app for Apple Silicon and Intel Macs.
            build-args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # The Tauri crate embeds the built frontend (dist/) at compile time.
      - run: npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      # Real PTY shells (cmd/pwsh on Windows, sh/bash/zsh elsewhere), git repos, hook sockets/pipes.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # Installers for testing, without updater signatures (those are made by the release workflow only).
      - name: Build installers
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: npx tauri build ${{ matrix.build-args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: rift-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
