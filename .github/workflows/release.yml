name: Release

# `git tag vX.Y.Z && git push --tags` triggers this workflow. The repo version stays 0.0.0: the build
# version is the tag plus the run number (X.Y.Z+RUN, shown as X.Y.Z.RUN). Each OS publishes its installers
# on the same GitHub Release, plus its entry in latest.json (read by the in-app updater).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
          - os: macos-latest
            build-args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag is vX.Y.Z
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not vX.Y.Z"
            exit 1
          fi

      - name: Linux system libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Version from tag and run number
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}+${{ github.run_number }}"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing key (see CLAUDE.md, "Releases"). Without it the updater artifacts cannot be signed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Rift ${{ github.ref_name }}
          releaseBody: |
            Windows: Rift_*_x64-setup.exe. macOS: Rift_*_universal.dmg (unsigned: allow it once in System Settings > Privacy & Security). Linux: .AppImage or .deb.
            Installed copies update themselves.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.build-args }}
